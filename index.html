<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HORMAR LOGISTIK</title>
<style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f7f6;color:#333}#loader{min-height:100vh;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#218838}</style>
</head>
<body>
<div id="loader">LASTER HORMAR LOGISTIK V6...</div>
<script>
fetch('app.html?v=20260817-filters2',{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
  .then(function(html){
    var patch=''
      + '<scr'+'ipt src="calendar-runtime-fix.js?v=20260817-filters2"></scr'+'ipt>'
      + '<scr'+'ipt src="accounting-runtime-fix.js?v=20260817-filters2"></scr'+'ipt>'
      + '<scr'+'ipt src="customer-status-runtime-fix.js?v=20260817-filters2"></scr'+'ipt>'
      + '<scr'+'ipt src="table-sort-runtime-fix.js?v=20260817-sort1"></scr'+'ipt>';
    if(/<\/body>/i.test(html)) html=html.replace(/<\/body>/i,patch+'</body>');
    else html+=patch;
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function(error){document.getElementById('loader').textContent='KUNNE IKKE LASTE HORMAR LOGISTIK. OPPDATER SIDEN.';console.error(error);});
</script>
</body>
</html>
