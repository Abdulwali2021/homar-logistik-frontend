<!DOCTYPE html>

<head>

<title>HORMAR LOGISTIK</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f7f6;color:#333}
#loader{min-height:100vh;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#218838}
</style>
</head>
<body>
<div id="loader">LASTER HORMAR LOGISTIK...</div>
<script>
fetch('app.html?v=20260814-wafi1',{cache:'no-store'})
  .then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.text();})
  .then(function(html){
    var patch='<scr'+'ipt src="homar-runtime-patch.js?v=20260814-wafi1"></scr'+'ipt>';
    if(/<\/body>/i.test(html)) html=html.replace(/<\/body>/i,patch+'</body>');
    else html+=patch;
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function(error){
    document.getElementById('loader').textContent='KUNNE IKKE LASTE HORMAR LOGISTIK. OPPDATER SIDEN.';
    console.error(error);
  });
</script>
</body>
</html>
