name: Rename LAGEROVERSIKT to LAGER
on:
  push:
    paths:
      - '.github/workflows/rename-lageroversikt.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename visible label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('>LAGEROVERSIKT</button>', '>LAGER</button>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Rename LAGEROVERSIKT to LAGER"
            git push
          fi
