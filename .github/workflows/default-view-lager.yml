name: Set LAGER as default view
on:
  push:
    paths:
      - '.github/workflows/default-view-lager.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set default view to lager
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Make LAGER the visually active tab in the initial HTML.
          s=re.sub(r'(id="tabKunde"\s+class=")nav-btn active("[^>]*>)', r'\1nav-btn\2', s)
          s=re.sub(r'(id="tabLager"\s+class=")nav-btn(?: active)?("[^>]*>)', r'\1nav-btn active\2', s)
          # Change explicit initial/default switch to kunde into lager, without touching the Kunde button onclick.
          s=s.replace("switchView('kunde');\n            renderAllTables();", "switchView('lager');\n            renderAllTables();")
          s=s.replace("switchView('kunde');\n        renderAllTables();", "switchView('lager');\n        renderAllTables();")
          # If login success has a direct default switch, change it too.
          s=s.replace("switchView('kunde'); //", "switchView('lager'); //")
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Open LAGER by default"
            git push
          fi
