name: Repair SAMEN historical dates

on:
  push:
    paths:
      - '.github/workflows/patch-samen-history.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch historical SAMEN date handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          old = 'lager[lagerIndex].date = todayStr; '
          new = 'lager[lagerIndex].date = date || lager[lagerIndex].date || todayStr; '
          if old not in text:
              raise SystemExit('Expected existing-lager SAMEN date line not found')
          text = text.replace(old, new, 1)

          old = 'date: todayStr, \n                        type: cleanType,'
          new = 'date: date || todayStr, \n                        type: cleanType,'
          if old not in text:
              raise SystemExit('Expected new-lager SAMEN date line not found')
          text = text.replace(old, new, 1)

          old = '<td>${todayStr}</td>\n                    <td>${tName}</td>'
          new = '<td>${item.date || todayStr}</td>\n                    <td>${tName}</td>'
          if old not in text:
              raise SystemExit('Expected lager rendered date line not found')
          text = text.replace(old, new, 1)

          old = '''            localStorage.setItem("homar_samen", JSON.stringify(list));
            resetLogisticsForm();
            loadData();'''
          new = '''            localStorage.setItem("homar_samen", JSON.stringify(list));

            // Hvis SAMEN registreres tilbake i tid, vis den valgte datoen med en gang.
            if (date !== todayStr) {
                const archiveMode = document.getElementById("archiveModeSelect");
                const archiveStart = document.getElementById("archiveStartDateInput");
                const archiveEnd = document.getElementById("archiveEndDateInput");
                const archiveRange = document.getElementById("archiveRangeContainer");
                if (archiveMode) archiveMode.value = "range";
                if (archiveStart) archiveStart.value = date;
                if (archiveEnd) archiveEnd.value = date;
                if (archiveRange) archiveRange.classList.remove("hidden");
            }

            resetLogisticsForm();
            loadData();'''
          if old not in text:
              raise SystemExit('Expected SAMEN save block not found')
          text = text.replace(old, new, 1)

          if text == original:
              raise SystemExit('No changes made')

          path.write_text(text, encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "HOMAR Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Fix SAMEN registration for historical dates"
          git push
