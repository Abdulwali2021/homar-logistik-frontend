name: Repair SAMEN historical dates

on:
  push:
    paths:
      - '.github/workflows/patch-samen-history.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch historical SAMEN date handling
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          replacements = [
              (
                  'lager[lagerIndex].date = todayStr;',
                  'lager[lagerIndex].date = date || lager[lagerIndex].date || todayStr;'
              ),
              (
                  'date: todayStr, \n                        type: cleanType,',
                  'date: date || todayStr, \n                        type: cleanType,'
              ),
              (
                  '<td>${todayStr}</td>\n                    <td>${tName}</td>',
                  '<td>${item.date || todayStr}</td>\n                    <td>${tName}</td>'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected code not found: ' + old.splitlines()[0])
              text = text.replace(old, new, 1)

          function_start = text.find('function saveLogistics()')
          if function_start < 0:
              raise SystemExit('saveLogistics function not found')

          marker = 'localStorage.setItem("homar_samen", JSON.stringify(list));'
          save_marker = text.find(marker, function_start)
          if save_marker < 0:
              raise SystemExit('SAMEN save marker not found')

          insert_at = save_marker + len(marker)
          archive_fix = '''

            // Hvis SAMEN registreres tilbake i tid, vis den valgte datoen med en gang.
            if (date !== todayStr) {
                const archiveMode = document.getElementById("archiveModeSelect");
                const archiveStart = document.getElementById("archiveStartDateInput");
                const archiveEnd = document.getElementById("archiveEndDateInput");
                const archiveRange = document.getElementById("archiveRangeContainer");
                if (archiveMode) archiveMode.value = "range";
                if (archiveStart) archiveStart.value = date;
                if (archiveEnd) archiveEnd.value = date;
                if (archiveRange) archiveRange.classList.remove("hidden");
            }'''
          text = text[:insert_at] + archive_fix + text[insert_at:]

          if text == original:
              raise SystemExit('No changes made')

          path.write_text(text, encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "HOMAR Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Fix SAMEN registration for historical dates"
          git push
