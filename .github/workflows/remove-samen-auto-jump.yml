name: Keep SAMEN screen on today

on:
  push:
    paths:
      - '.github/workflows/remove-samen-auto-jump.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove automatic jump to historical date
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          pattern = re.compile(r'''\n\s*// Hvis SAMEN registreres tilbake i tid, vis den valgte datoen med en gang\.\n\s*if \(date !== todayStr\) \{.*?\n\s*\}\n\s*resetLogisticsForm\(\);''', re.S)
          replacement = '\n            resetLogisticsForm();'
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected historical auto-jump block once, found {count}')

          path.write_text(text, encoding='utf-8')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "HOMAR Repair"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Keep SAMEN on today's view after historical registration"
          git push
